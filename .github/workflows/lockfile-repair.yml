# Temporary resolution job; removed after the generated blob is committed.
name: Resolve documentation lockfile
on:
  push:
    branches: [docs/fumadocs-migration]
permissions:
  contents: read
jobs:
  resolve:
    if: github.repository == 'conceptadev/ack'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
      - run: npm install --global pnpm@11.5.3
      - name: Resolve without executing dependency scripts
        working-directory: docs-site
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Store lockfile as an unattached Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: await readFile('docs-site/pnpm-lock.yaml', 'utf8'), encoding: 'utf-8' })
          });
          if (!response.ok) throw new Error(`Cannot store lockfile: ${response.status}`);
          console.log('LOCKFILE_BLOB_SHA=' + (await response.json()).sha);
          NODE
